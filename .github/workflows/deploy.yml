name: Deploy to GitHub Pages

# Every push to main rebuilds and republishes, so the live link is never stale
# and you never commit build output.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run waits for the in-flight one rather than racing it to publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the SDK this project was built and verified against.
          # `channel: stable` would silently drift and could break the build on
          # an unrelated day.
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify before publishing
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      # "/" is correct because the repo is named samer-aljammal.github.io, which
      # GitHub serves from the domain root. If this ever moves to a project repo
      # (e.g. .../portfolio/), this must become "/portfolio/" — a mismatch
      # resolves every asset against the wrong path and serves a blank page.
      - run: flutter build web --release --base-href /

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
